<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loops - sound-sketch</title>
  </head>
  <body>
    <header class="toolbar">
      <nav class="nav">
        <a href="./">Keyboard</a>
        <a href="./ripples.html">Ripples</a>
        <a href="./phase.html">Phase</a>
        <a href="./loops.html" aria-current="page">Loops</a>
      </nav>
      <label>スケール <select id="scale"></select></label>
      <label>主音 <select id="root"></select></label>
      <label>音域 <input id="register" type="range" min="1" max="5" step="1" /> <output id="register-value"></output></label>
      <label>密度 <input id="density" type="range" min="1" max="5" step="1" /> <output id="density-value"></output></label>
      <label><input id="weather" type="checkbox" /> 天気</label>
      <select id="place" aria-label="場所"></select>
      <span id="weather-status" class="status"></span>
      <label><input id="drift" type="checkbox" /> 変化</label>
      <select id="drift-speed" aria-label="変化の速さ">
        <option value="1">×1</option>
        <option value="10">×10</option>
        <option value="60">×60</option>
      </select>
      <span id="drift-status" class="status"></span>
      <button id="record" type="button">● 録音</button>
      <span id="record-status" class="status"></span>
      <label><input id="auto" type="checkbox" checked /> 自動</label>
      <button id="clear" type="button">クリア</button>
    </header>
    <canvas id="canvas"></canvas>
    <p id="hint" class="hint">
      クリックでテープループを置く。縦の位置で音の高さ、横の位置でループの長さ（15〜35 秒）が決まります<br />
      長さの違うループが重なり、同じ響きはほとんど二度と来ません。ループの中心をクリックすると外せます<br />
      「録音」を押してクリックで演奏し、「停止」を押すと、そのフレーズが録音した長さのループになります
    </p>
    <script type="module" src="/src/loops/main.ts"></script>
  </body>
</html>
