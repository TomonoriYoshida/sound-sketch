<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phase - sound-sketch</title>
  </head>
  <body>
    <header class="toolbar">
      <nav class="nav">
        <a href="./">Keyboard</a>
        <a href="./ripples.html">Ripples</a>
        <a href="./phase.html" aria-current="page">Phase</a>
        <a href="./loops.html">Loops</a>
      </nav>
      <label>スケール <select id="scale"></select></label>
      <label>主音 <select id="root"></select></label>
      <label><input id="weather" type="checkbox" /> 天気</label>
      <select id="place" aria-label="場所"></select>
      <span id="weather-status" class="status"></span>
      <label><input id="drift" type="checkbox" /> 変化</label>
      <select id="drift-speed" aria-label="変化の速さ">
        <option value="1">×1</option>
        <option value="10">×10</option>
        <option value="60">×60</option>
      </select>
      <span id="drift-status" class="status"></span>
      <label><input id="fade" type="checkbox" checked /> 減衰</label>
      <label><input id="auto" type="checkbox" checked /> 自動</label>
      <button id="clear" type="button">クリア</button>
    </header>
    <canvas id="canvas"></canvas>
    <p id="hint" class="hint">
      クリックで音を置く。縦の位置で音の高さ、横の位置でループの周期が決まります<br />
      周期がわずかに違う音どうしは、少しずつずれていきます
    </p>
    <script type="module" src="/src/phase/main.ts"></script>
  </body>
</html>
